<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Pong solo</title>
<style>body {background: #091c2d;} canvas {background:#091c2d;}</style></head>
<body><canvas id="game" width="320" height="240"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let paddle=132;
let ballX=157;
let ballY=115;
let vx=2;
let vy=3;
let score=0;
let lives=3;
let over=0;
function update() {
 if (over == 1) {
   if (keys.Space) {paddle=132;ballX=157;ballY=115;vx=2;vy=3;score=0;lives=3;over=0;}
 } else {
   if (keys.ArrowLeft) paddle -= 4;
   if (keys.ArrowRight) paddle += 4;
   if (paddle < 2) paddle=2;
   if (paddle > 260) paddle=260;
   ballX += vx;
   ballY += vy;
   if (ballX < 2) {ballX=2;vx=-vx;}
   if (ballX > 310) {ballX=310;vx=-vx;}
   if (ballY < 36) {ballY=36;vy=-vy;}
   if (ballY >= 208 && ballY < 219 && ballX+8 > paddle && ballX < paddle+58 && vy > 0) {
     ballY=207;vy=-vy;score+=1;
     if (score > 8) vy=-4;
     if (ballX < paddle+18) vx=-3;
     if (ballX > paddle+40) vx=3;
   }
   if (ballY > 241) {
     lives-=1;ballX=157;ballY=105;vx=2;vy=3;
     if (lives < 1) over=1;
   }
 }
}
function draw() {
 ctx.fillStyle='#091c2d';ctx.fillRect(0,0,320,240);
 ctx.fillStyle='#14344b';ctx.fillRect(0,0,320,30);
 ctx.fillStyle='#e1f3ff';ctx.fillText('PONG SOLO',8,9);
 ctx.fillText('PUNTOS',145,9);ctx.fillText(score,198,9);
 ctx.fillText('VIDAS',253,9);ctx.fillText(lives,297,9);
 ctx.fillStyle='#1c3b50';ctx.fillRect(0,126,320,2);
 ctx.fillStyle='#48e6c1';ctx.fillRect(paddle,218,58,7);
 ctx.fillStyle='#ffffff';ctx.fillRect(ballX,ballY,8,8);
 ctx.fillStyle='#89abc2';ctx.fillText('IZQ/DCHA: PALA  SELECT: MENU',7,231);
 if (over == 1) {
   ctx.fillStyle='#091c2d';ctx.fillRect(60,82,200,53);
   ctx.fillStyle='#ff9b81';ctx.fillText('SIN VIDAS',116,96);
   ctx.fillStyle='#ffffff';ctx.fillText('A PARA REINICIAR',94,115);
 }
}
</script></body></html>
